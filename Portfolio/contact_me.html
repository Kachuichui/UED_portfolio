<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <title>Project one</title>
    <link href="https://fonts.googleapis.com" rel="preconnect"/>
    <link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&amp;family=Noto+Sans+SC:wght@400;500;700&amp;display=swap"
          rel="stylesheet"/>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <!--    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>-->
    <style type="text/tailwindcss">
        @layer theme {
            :root {
                --color-primary: #436C85;
                --color-secondary: #B73F42;
                --color-accent: #DE9960;
                --color-success: #82B29B;
                --color-background-light: #EEE6DB;
                --color-background-dark: #2C2823;
                --color-text-light: #436C85;
                /*#1F1B17;*/
                --color-text-dark: #EAE3D9;
                --color-subtle-light: #DCD2C3;
                --color-subtle-dark: #423C35;
            }
        }
    </style>
    <script>
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        primary: "var(--color-primary)",
                        secondary: "var(--color-secondary)",
                        accent: "var(--color-accent)",
                        success: "var(--color-success)",
                        "background-light": "var(--color-background-light)",
                        "background-dark": "var(--color-background-dark)",
                        "text-light": "var(--color-text-light)",
                        "text-dark": "var(--color-text-dark)",
                        "subtle-light": "var(--color-subtle-light)",
                        "subtle-dark": "var(--color-subtle-dark)",
                    },
                    fontFamily: {
                        display: ["Inter", "sans-serif"],
                        // display: ["Playfair Display", "serif"],
                        body: ["Noto Sans SC", "serif"],
                        // body: ["Noto Sans SC", "sans-serif"],
                    },
                    borderRadius: {
                        DEFAULT: "0.5rem",
                        lg: "0.75rem",
                        xl: "1rem",
                        full: "9999px",
                    },
                    backgroundImage: {
                        'tang-pattern': "url(\"data:image/svg+xml,%3Csvg width='60' height='60' viewBox='0 0 60 60' xmlns='http://www.w3.org/2000/svg'%3E%3Cg fill='none' fill-rule='evenodd'%3E%3Cg fill='%23B73F42' fill-opacity='0.1'%3E%3Cpath d='M36 34v-4h-2v4h-4v2h4v4h2v-4h4v-2h-4zm0-30V0h-2v4h-4v2h4v4h2V6h4V4h-4zM6 34v-4H4v4H0v2h4v4h2v-4h4v-2H6zM6 4V0H4v4H0v2h4v4h2V6h4V4H6z'/%3E%3C/g%3E%3C/g%3E%3C/svg%3E\")",
                    }
                },
            },
        };
    </script>
</head>


<body class="bg-background-light dark:bg-background-dark font-body text-text-light dark:text-text-dark bg-tang-pattern">
<div class="flex flex-col min-h-screen bg-background-light/95 dark:bg-background-dark/95">
    <header class="sticky top-0 z-10 bg-background-light/80 dark:bg-background-dark/80 backdrop-blur-sm border-b border-subtle-light dark:border-subtle-dark">
        <div class="container mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex items-center justify-between h-16">
                <div class="flex items-center gap-3">
                    <svg class="h-8 w-8 text-secondary" fill="currentColor" viewBox="0 0 24 24"
                         xmlns="http://www.w3.org/2000/svg">
                        <path d="M12 2L1 6.5V17.5L12 22L23 17.5V6.5L12 2ZM11 12.44L4 8.5V16.34L11 20.24V12.44ZM13 12.44V20.24L20 16.34V8.5L13 12.44ZM12 4.1L18.93 7.5L12 10.9L5.07 7.5L12 4.1Z"></path>
                    </svg>
                    <h1 onclick="window.location.href='home_screen.html'"
                        class="text-2xl font-bold tracking-tight font-serif-sc text-primary cursor-pointer">Xinuo
                        Zhou</h1>
                </div>

                <nav class="hidden md:flex items-center space-x-8">
                    <a onclick="window.location.href='about_me.html'"
                       class="text-text-secondary hover:text-primary transition-colors font-medium cursor-pointer">About
                        me</a>
                    <a onclick="window.location.href='project_showcase.html'"
                       class="text-secondary font-semibold cursor-pointer">Projects</a>
                    <a onclick="window.location.href='contact_me.html'"
                       class="text-text-secondary hover:text-primary transition-colors font-medium cursor-pointer">Contact</a>
                    <a onclick="window.location.href='Resume.html'"
                       class="text-text-secondary hover:text-primary transition-colors font-medium cursor-pointer">Resume</a>
                </nav>

                <button popovertarget="mobile-menu"
                        class="md:hidden p-2 rounded-md text-text-secondary hover:text-primary hover:bg-primary/10 focus:outline-none focus:ring-2 focus:ring-inset focus:ring-primary">
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"
                         xmlns="http://www.w3.org/2000/svg">
                        <path d="M4 6h16M4 12h16M4 18h16" stroke-linecap="round" stroke-linejoin="round"
                              stroke-width="2"></path>
                    </svg>
                </button>

                <div id="mobile-menu" popover
                     class="md:hidden m-0 mt-2 p-4 bg-background-light border border-base rounded-lg shadow-lg w-48">
                    <nav class="flex flex-col gap-4">
                        <a onclick="window.location.href='about_me.html'"
                           class="text-text-secondary hover:text-primary transition-colors font-medium cursor-pointer">About
                            me</a>
                        <a onclick="window.location.href='project_showcase.html'"
                           class="text-secondary font-semibold cursor-pointer">Projects</a>
                        <a onclick="window.location.href='contact_me.html'"
                           class="text-text-secondary hover:text-primary transition-colors font-medium cursor-pointer">Contact</a>
                        <a onclick="window.location.href='Resume.html'"
                           class="text-text-secondary hover:text-primary transition-colors font-medium cursor-pointer">Resume</a>
                    </nav>
                </div>


            </div>
        </div>
    </header>

    <main class="flex flex-1 items-center justify-center py-12">
        <div class="container mx-auto flex max-w-5xl flex-col px-4 md:flex-row md:gap-16">

            <!-- 左列：标题 + 联系方式 -->
            <div class="w-full md:w-2/5 text-center md:text-left">
                <h1 class="text-5xl font-extrabold tracking-tighter text-primary"
                    style="font-family: serif; letter-spacing: -0.05em;">Let's Connect</h1>
                <p class="mt-4 text-lg text-primary/80">
                    I'm currently seeking new opportunities and collaborations. Reach out with any inquiries or project ideas. I look forward to hearing from you.
                </p>
                <div class="mt-8 space-y-4 text-primary">
                    <div class="flex items-center justify-center gap-3 md:justify-start">
                        <!-- email icon -->
                        <svg class="h-5 w-5 text-accent" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" viewBox="0 0 24 24">
                            <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"></path>
                            <polyline points="22,6 12,13 2,6"></polyline>
                        </svg>
                        <span>nuolici@gmail.com</span>
                    </div>
                    <div class="flex items-center justify-center gap-3 md:justify-start">
                        <!-- phone icon -->
                        <svg class="h-5 w-5 text-accent" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" viewBox="0 0 24 24">
                            <path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"></path>
                        </svg>
                        <span>+44 07434954704</span>
                    </div>
                    <div class="flex items-center justify-center gap-3 md:justify-start">
                        <!-- location icon -->
                        <svg class="h-5 w-5 text-accent" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" viewBox="0 0 24 24">
                            <path d="M12 22s-8-4.5-8-11.8A8 8 0 0 1 12 2a8 8 0 0 1 8 8.2c0 7.3-8 11.8-8 11.8z"></path>
                            <circle cx="12" cy="10" r="3"></circle>
                        </svg>
                        <span>London, UK</span>
                    </div>
                </div>
            </div>

            <!-- 右列：表单（和左列是同级兄弟） -->
            <div class="w-full md:w-3/5 mt-12 md:mt-0">
                <div class="rounded-lg bg-base p-8 shadow-xl shadow-accent/10">
                    <form class="space-y-4" action="https://formspree.io/f/manljyvv" method="POST">
                        <label class="block">
                            <span class="sr-only">Your Name</span>
                            <input class="form-input w-full rounded-lg border-primary/30 bg-base p-4 text-primary placeholder-primary/50 transition focus:border-accent focus:ring-accent"
                                   type="text" name="name" placeholder="Your Name" autocomplete="name" required />
                        </label>

                        <label class="block">
                            <span class="sr-only">Your Email</span>
                            <input class="form-input w-full rounded-lg border-primary/30 bg-base p-4 text-primary placeholder-primary/50 transition focus:border-accent focus:ring-accent"
                                   type="email" name="email" placeholder="Your Email" autocomplete="email" required />
                        </label>

                        <label class="block">
                            <span class="sr-only">Subject</span>
                            <input class="form-input w-full rounded-lg border-primary/30 bg-base p-4 text-primary placeholder-primary/50 transition focus:border-accent focus:ring-accent"
                                   type="text" name="subject" placeholder="Subject" required />
                        </label>

                        <label class="block">
                            <span class="sr-only">Your Message</span>
                            <textarea class="form-textarea w-full rounded-lg border-primary/30 bg-base p-4 text-primary placeholder-primary/50 transition focus:border-accent focus:ring-accent"
                                      name="message" rows="5" placeholder="Your Message" required></textarea>
                        </label>

                        <input type="text" name="_gotcha" class="hidden" tabindex="-1" autocomplete="off" />
                        <input type="hidden" name="_redirect" value="https://www.xinuo.space/contact_me.html" />
                        <input type="hidden" name="_subject" value="New message from portfolio contact form" />

                        <button type="submit"
                                class="w-full rounded-lg bg-secondary py-3 font-bold text-background-light shadow-lg transition-colors hover:bg-accent/90">
                            Send Message
                        </button>
                    </form>
                </div>
            </div>

        </div>
    </main>

</div>
</div>
</body>
</html>
